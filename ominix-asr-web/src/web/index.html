<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OminiX 实时语音识别</title>
<style>
:root {
  --bg: #0f1115; --panel: #171a21; --border: #262b36;
  --text: #e6e9ef; --dim: #8b93a5; --accent: #4f8cff;
  --ok: #34c98e; --warn: #f0a35e; --err: #f0647a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  min-height: 100vh; padding: 20px 20px;
}
#app {
  width: 100%; max-width: 1520px; margin: 0 auto;
  display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px;
}
#leftCol { width: 300px; min-width: 180px; }
#midCol { flex: 1; min-width: 320px; }
#rightCol { width: 340px; min-width: 180px; }
header { flex-basis: 100%; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.grip {
  width: 8px; align-self: stretch; cursor: col-resize; position: relative;
  border-radius: 4px; flex: none; margin-top: 4px;
}
.grip::before {
  content: ''; position: absolute; left: 50%; top: 0; bottom: 0;
  transform: translateX(-50%); width: 1px; background: var(--border);
  transition: width 0.15s, background 0.15s;
}
.grip::after {
  content: ''; position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%); width: 4px; height: 28px;
  border-radius: 2px; background: var(--border); opacity: 0;
  transition: opacity 0.15s;
}
.grip:hover::before, .grip.active::before { background: var(--accent); width: 2px; }
.grip:hover::after, .grip.active::after { opacity: 1; background: var(--accent); }
h1 { font-size: 20px; font-weight: 600; }
.badges { display: flex; gap: 8px; flex-wrap: wrap; }
.badge {
  font-size: 12px; padding: 4px 10px; border-radius: 999px;
  border: 1px solid var(--border); color: var(--dim); white-space: nowrap;
}
.badge.on { color: var(--ok); border-color: var(--ok); }
.badge.off { color: var(--warn); border-color: var(--warn); }
.badge.err { color: var(--err); border-color: var(--err); }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
.col { display: flex; flex-direction: column; }
.col.sticky { position: sticky; top: 16px; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.controls .row { width: 100%; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.lbl { font-size: 12px; color: var(--dim); }
button, select {
  font-size: 13px; padding: 8px 12px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--border); background: #1e232e; color: var(--text);
}
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button.danger:hover { border-color: var(--err); color: var(--err); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button.wide { width: 100%; margin-bottom: 8px; }
select { flex: 1; min-width: 100px; }
label.small { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
.live {
  min-height: 110px; font-size: 20px; line-height: 1.7;
  display: flex; align-items: center;
}
.live .placeholder { color: var(--dim); }
.live .text { width: 100%; word-break: break-all; }
.live .text.partial { color: #a9c2ff; }
.panel h3 { font-size: 13px; color: var(--dim); margin-bottom: 12px; }
.history { max-height: calc(100vh - 260px); overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.history .seg { display: flex; gap: 10px; font-size: 14px; line-height: 1.6; }
.history .seg .ts { color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; padding-top: 1px; }
.history .seg .txt { word-break: break-all; }
.history .seg .raw { color: var(--dim); font-size: 12px; margin-top: 2px; word-break: break-all; }
.history .seg .raw::before { content: "原文: "; }
.history .seg .meta { font-size: 11px; color: var(--accent); margin-bottom: 2px; min-height: 14px; }
.empty { color: var(--dim); text-align: center; padding: 20px 0; font-size: 14px; }
#summaryList { max-height: calc(100vh - 360px); overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
#summaryList .sum { background: #1e232e; border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-size: 13px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
#summaryList .sum .sum-ts { font-size: 11px; color: var(--dim); margin-bottom: 6px; }
#summaryLoading { color: var(--dim); font-size: 13px; text-align: center; padding: 10px; display: none; }
#toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: #1e232e; border: 1px solid var(--accent); color: var(--text);
  padding: 10px 18px; border-radius: 10px; font-size: 13px; display: none;
  max-width: 80vw; word-break: break-all; z-index: 10;
}
#vumeter { width: 100%; height: 6px; background: #1e232e; border-radius: 3px; overflow: hidden; margin-top: 10px; }
#vumeter .bar { height: 100%; width: 0%; background: var(--accent); transition: width 0.1s; }
@media (max-width: 1000px) {
  #app { flex-direction: column; }
  header { flex-basis: auto; }
  .grip { display: none; }
  #leftCol, #rightCol, #midCol { width: 100% !important; }
  .col.sticky { position: static; }
  .history, #summaryList { max-height: none; }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>OminiX 实时语音识别</h1>
    <div class="badges">
      <span class="badge off" id="micBadge">● 未采集</span>
      <span class="badge off" id="modelBadge">ASR 未加载</span>
      <span class="badge off" id="polishBadge">增强未加载</span>
      <span class="badge off" id="summaryBadge">摘要未加载</span>
      <span class="badge" id="tokBadge">生成速度 -</span>
      <span class="badge" id="memBadge">内存 -</span>
      <span class="badge" id="idleBadge">空闲 -</span>
    </div>
  </header>

  <!-- 左栏: 控制台 -->
  <aside class="col sticky" id="leftCol">    <div class="panel">
      <div class="controls">
        <div class="row">
          <span class="lbl">识别语言</span>
          <select id="lang" title="识别语言">
            <option value="Auto" selected>自动识别</option>
            <option value="Chinese">中文</option>
            <option value="English">English</option>
            <option value="Japanese">日本語</option>
            <option value="Korean">한국어</option>
            <option value="Cantonese">粤语</option>
            <option value="German">Deutsch</option>
            <option value="French">Français</option>
            <option value="Spanish">Español</option>
            <option value="Russian">Русский</option>
          </select>
        </div>
        <div class="row">
          <span class="lbl">音频源</span>
          <select id="sourceMode" title="音频来源">
            <option value="mic" selected>麦克风</option>
            <option value="system">系统音频</option>
          </select>
          <select id="deviceSel" title="录音设备" style="flex:2"></select>
          <button id="btnRefreshDevices" title="刷新设备">⟳</button>
        </div>
        <div class="row">
          <span class="lbl">后处理</span>
          <select id="enhanceMode" title="转写后处理">
            <option value="polish" selected>AI润色</option>
            <option value="translate">实时翻译</option>
            <option value="off">关闭增强</option>
          </select>
          <span class="lbl" id="targetLbl" style="display:none">目标</span>
          <select id="targetLang" title="翻译目标语言" style="display:none">
            <option value="English" selected>English</option>
            <option value="中文">中文</option>
            <option value="日本語">日本語</option>
            <option value="한국어">한국어</option>
            <option value="Deutsch">Deutsch</option>
            <option value="Français">Français</option>
            <option value="Español">Español</option>
            <option value="Русский">Русский</option>
          </select>
        </div>
        <button class="primary wide" id="btnMic">开始录音</button>
        <label class="small"><input type="checkbox" id="autoSave" checked> 自动保存(每60秒)</label>
        <div id="vumeter"><div class="bar" id="vubar"></div></div>
      </div>
    </div>

    <div class="panel">
      <details id="domainPanel">
        <summary style="cursor:pointer;font-size:13px;color:var(--dim)">领域优化（术语/上下文）</summary>
        <div style="height:10px"></div>
        <div style="font-size:11px;color:var(--dim);margin-bottom:8px">
          配置: <span id="domainPath">加载中…</span>（编辑文件后 5 秒内自动生效）
        </div>
        <label style="font-size:12px;color:var(--dim)">[system] 提示词</label>
        <textarea id="systemPrompt" rows="2" readonly style="width:100%;margin-top:4px;background:#1e232e;border:1px solid var(--border);border-radius:8px;color:var(--dim);padding:8px;font-size:12px;resize:vertical"></textarea>
        <label style="font-size:12px;color:var(--dim);display:block;margin-top:10px">[terms] 术语表</label>
        <textarea id="termsList" rows="4" readonly style="width:100%;margin-top:4px;background:#1e232e;border:1px solid var(--border);border-radius:8px;color:var(--dim);padding:8px;font-size:12px;resize:vertical"></textarea>
        <button id="btnReloadDomain" style="margin-top:8px">重新加载配置</button>
        <span id="domainStatus" style="font-size:11px;color:var(--dim)"></span>
      </details>
    </div>
  </aside>

  <div class="grip" id="gripL" title="拖动调整宽度"></div>

  <!-- 中栏: 实时转写 -->
  <main class="col" id="midCol">
    <div class="panel live">
      <div class="placeholder" id="livePlaceholder">点击"开始录音"，说话后转写结果将实时显示在这里…</div>
      <div class="text partial" id="liveText" style="display:none"></div>
    </div>
    <div class="panel">
      <h3>转写记录 <span id="segCount" style="color:var(--text)"></span></h3>
      <div class="history" id="history"><div class="empty">暂无记录</div></div>
    </div>
  </main>

  <div class="grip" id="gripR" title="拖动调整宽度"></div>

  <!-- 右栏: AI 摘要 + 导出 -->
  <aside class="col sticky" id="rightCol">
    <div class="panel">
      <h3>AI 摘要</h3>
      <div class="row" style="margin-bottom:8px">
        <span class="lbl">摘要类型</span>
        <select id="summaryType" style="flex:1">
          <option value="meeting" selected>会议摘要（待办事项）</option>
          <option value="content">内容摘要（综合反思）</option>
        </select>
      </div>
      <div class="row" style="margin-bottom:8px">
        <span class="lbl">摘要方式</span>
        <select id="summaryMode" style="flex:1">
          <option value="source" selected>原文摘要</option>
          <option value="translate">翻译摘要</option>
          <option value="both">两者都生成</option>
        </select>
      </div>
      <div class="row" style="margin-bottom:8px">
        <span class="lbl">翻译语言</span>
        <select id="summaryTarget" style="flex:1">
          <option value="English" selected>English</option>
          <option value="中文">中文</option>
          <option value="日本語">日本語</option>
          <option value="한국어">한국어</option>
        </select>
      </div>
      <button class="primary wide" id="btnSummarize">生成摘要</button>
      <button class="wide" id="btnSaveSummary">保存摘要</button>
      <button class="wide danger" id="btnClearSummary">清空摘要</button>
      <div id="summaryLoading">正在生成摘要（首次需加载模型，约 3-5 秒）…</div>
      <div id="summaryList"><div class="empty">转写完成后点"生成摘要"</div></div>
    </div>
    <div class="panel">
      <h3>导出</h3>
      <button class="wide" id="btnSubtitle">字幕模式</button>
      <button class="wide" id="btnSave">保存转写</button>
      <button class="wide" id="btnDownload">下载最近保存</button>
      <button class="wide danger" id="btnUnload">卸载全部模型</button>
      <button class="wide danger" id="btnClear">清空转写记录</button>
    </div>
  </aside>
</div>

<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let ws = null, audioCtx = null, workletNode = null, micStream = null, scriptNode = null;
let lang = 'Auto', wsReady = false, timerAuto = null, timerPoll = null;

function toast(msg, ms = 2600) {
  const t = $('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', ms);
}

function setMic(on) {
  const sourceMode = $('sourceMode').value === 'system' ? '系统音频' : '麦克风';
  $('micBadge').textContent = on ? `● ${sourceMode}录音中` : '● 未采集';
  $('micBadge').className = 'badge ' + (on ? 'on' : 'off');
  $('btnMic').textContent = on ? '停止录音' : '开始录音';
  $('btnMic').classList.toggle('primary', !on);
  $('sourceMode').disabled = on;
  $('deviceSel').disabled = on || $('sourceMode').value === 'system';
  $('btnRefreshDevices').disabled = on;
}

function setModel(loaded, loading) {
  const b = $('modelBadge');
  if (loading) { b.textContent = 'ASR 模型加载中…'; b.className = 'badge off'; }
  else if (loaded) { b.textContent = 'ASR 模型已加载'; b.className = 'badge on'; }
  else { b.textContent = 'ASR 未加载(空闲已卸载)'; b.className = 'badge off'; }
}

function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => { wsReady = true; ws.send(JSON.stringify({type:'lang', lang})); };
  ws.onmessage = ev => {
    let m;
    try { m = JSON.parse(ev.data); } catch { return; }
    if (m.type === 'partial' && m.text) {
      $('livePlaceholder').style.display = 'none';
      $('liveText').style.display = 'block';
      $('liveText').classList.add('partial');
      $('liveText').textContent = m.text;
    } else if (m.type === 'final' && m.text) {
      $('livePlaceholder').style.display = 'none';
      $('liveText').style.display = 'block';
      $('liveText').classList.remove('partial');
      $('liveText').textContent = m.text;
      addSegment(m.text, null, m.ts, null, m.id);
      subChan.postMessage({ type: 'final', id: m.id, text: m.text, src_lang: m.src_lang });
    } else if (m.type === 'enhanced' && m.id !== undefined) {
      const seg = document.querySelector(`.seg[data-id="${m.id}"]`);
      if (seg) {
        const body = seg.querySelector('.body');
        const txt = body.querySelector('.txt');
        const meta = body.querySelector('.meta');
        if (m.translated) {
          txt.textContent = m.translated;
          meta.textContent = `译自: ${m.src_lang || '自动识别'}`;
        } else if (m.polished) {
          txt.textContent = m.polished;
          meta.textContent = '已润色';
        }
        if (!body.querySelector('.raw')) {
          const raw = document.createElement('div');
          raw.className = 'raw';
          raw.textContent = txt.dataset.orig || '';
          body.appendChild(raw);
        }
        if ($('liveText').textContent === (txt.dataset.orig || '')) {
          $('liveText').textContent = txt.textContent;
          $('liveText').classList.remove('partial');
        }
        subChan.postMessage(m);
      }
    } else if (m.type === 'polish_status') {
      const b = $('polishBadge');
      if (m.loading) { b.textContent = '增强模型加载中…'; b.className = 'badge off'; }
      else if (m.loaded) { b.textContent = '增强模型已加载'; b.className = 'badge on'; }
      else { b.textContent = '增强模型未加载'; b.className = 'badge off'; }
    } else if (m.type === 'summary_status') {
      const b = $('summaryBadge');
      if (m.loading) { b.textContent = '摘要模型加载中…'; b.className = 'badge off'; }
      else if (m.loaded) { b.textContent = '摘要模型已加载'; b.className = 'badge on'; }
      else { b.textContent = '摘要模型未加载'; b.className = 'badge off'; }
    } else if (m.type === 'summary' && m.text) {
      $('summaryLoading').style.display = 'none';
      addSummary(m.text, m.ts, m.label);
    } else if (m.type === 'summary_cleared') {
      $('summaryList').innerHTML = '<div class="empty">转写完成后点"生成摘要"</div>';
    } else if (m.type === 'tok_stat') {
      $('tokBadge').textContent = `生成速度 ${m.tok_s} tok/s`;
    } else if (m.type === 'enhance_applied') {
      if (!m.available) toast('增强模型不可用（未找到模型文件）');
      $('enhanceMode').value = m.mode;
      $('targetLang').style.display = m.mode === 'translate' ? '' : 'none';
      $('targetLbl').style.display = m.mode === 'translate' ? '' : 'none';
      $('targetLang').value = m.target || 'English';
    } else if (m.type === 'status') {
      setModel(!!m.model_loaded, !!m.loading);
      if (m.model_loaded === false && !m.loading) toast('模型已从内存卸载（空闲超时）');
    } else if (m.type === 'saved') {
      toast('已保存: ' + m.path, 5000);
    } else if (m.type === 'domain') {
      $('systemPrompt').value = m.system || '';
      $('termsList').value = (m.terms || []).join('\n');
      $('domainPath').textContent = m.path || '';
    } else if (m.type === 'context_applied') {
      $('domainStatus').textContent = `已应用: 提示词${m.system ? '✓' : '✗'} / ${m.terms} 个术语`;
    } else if (m.type === 'error') {
      $('summaryLoading').style.display = 'none';
      toast('错误: ' + m.text, 4000);
    }
  };
  ws.onclose = () => { wsReady = false; setMic(false); setTimeout(connectWS, 2000); };
}

function addSegment(text, enhanced, ts, label, id) {
  const h = $('history');
  const empty = h.querySelector('.empty');
  if (empty) empty.remove();
  const d = document.createElement('div');
  d.className = 'seg';
  if (id !== undefined && id !== null) d.dataset.id = id;
  const t = document.createElement('div'); t.className = 'ts'; t.textContent = ts;
  const body = document.createElement('div'); body.className = 'body';
  const meta = document.createElement('div'); meta.className = 'meta';
  const x = document.createElement('div'); x.className = 'txt';
  x.textContent = enhanced && enhanced.trim() ? enhanced : text;
  x.dataset.orig = text;
  body.appendChild(meta);
  body.appendChild(x);
  if (enhanced && enhanced.trim() && enhanced !== text) {
    const raw = document.createElement('div'); raw.className = 'raw';
    raw.textContent = text;
    body.appendChild(raw);
  }
  d.appendChild(t); d.appendChild(body);
  // 最新内容插到最上方
  h.insertBefore(d, h.firstChild);
  h.scrollTop = 0;
  updateCount();
}

function addSummary(text, ts, label) {
  const list = $('summaryList');
  const empty = list.querySelector('.empty');
  if (empty) empty.remove();
  const d = document.createElement('div');
  d.className = 'sum';
  const hd = document.createElement('div');
  hd.className = 'sum-ts';
  hd.textContent = (label ? label + ' · ' : '') + (ts || '');
  d.appendChild(hd);
  d.appendChild(document.createTextNode(text));
  // 最新摘要置顶
  list.insertBefore(d, list.firstChild);
  list.scrollTop = 0;
}

function updateCount() {
  const n = $('history').querySelectorAll('.seg').length;
  $('segCount').textContent = n ? `(${n} 段)` : '';
}

async function startMic() {
  const sourceMode = $('sourceMode').value;
  let stream = null;
  try {
    if (sourceMode === 'system') {
      try {
        stream = await navigator.mediaDevices.getDisplayMedia({ video: false, audio: true });
      } catch (e1) {
        stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
      }
    } else {
      const deviceId = $('deviceSel').value;
      const constraints = {
        audio: {
          channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true
        }
      };
      if (deviceId && deviceId !== 'default') constraints.audio.deviceId = { exact: deviceId };
      try {
        stream = await navigator.mediaDevices.getUserMedia(constraints);
      } catch (e1) {
        toast('所选设备不可用，已回退默认麦克风');
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      }
    }
  } catch (e) {
    toast('无法获取音频: ' + e.message + '（麦克风请授权；系统音频请使用 Chrome/Edge 并勾选"共享音频"）', 5000);
    return;
  }
  micStream = stream;
  const track = stream.getAudioTracks()[0];
  if (track) track.onended = () => { toast('音频源已断开'); stopMic(); };

  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 }); }
  catch (e) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
  const src = audioCtx.createMediaStreamSource(micStream);

  const workletCode = `
    class PcmProcessor extends AudioWorkletProcessor {
      constructor() { super(); this.ratio = sampleRate / 16000; this.pos = 0; }
      process(inputs) {
        const ch = inputs[0][0];
        if (!ch) return true;
        if (this.ratio === 1) { this.port.postMessage(new Float32Array(ch)); return true; }
        const out = [];
        while (this.pos < ch.length) {
          const i0 = Math.floor(this.pos), i1 = Math.min(i0 + 1, ch.length - 1);
          const f = this.pos - i0;
          out.push(ch[i0] * (1 - f) + ch[i1] * f);
          this.pos += this.ratio;
        }
        this.pos -= ch.length;
        if (out.length) this.port.postMessage(new Float32Array(out));
        return true;
      }
    }
    registerProcessor('pcm-processor', PcmProcessor);
  `;

  const sendPcm = data => {
    if (ws && wsReady && ws.readyState === 1) ws.send(data);
    let rms = 0;
    for (let i = 0; i < data.length; i += 64) rms += data[i] * data[i];
    rms = Math.sqrt(rms / Math.max(1, data.length / 64));
    $('vubar').style.width = Math.min(100, rms * 900) + '%';
  };

  if (audioCtx.audioWorklet) {
    try {
      await audioCtx.audioWorklet.addModule(URL.createObjectURL(new Blob([workletCode], { type: 'application/javascript' })));
      workletNode = new AudioWorkletNode(audioCtx, 'pcm-processor');
      workletNode.port.onmessage = e => sendPcm(e.data);
      src.connect(workletNode);
      workletNode.connect(audioCtx.destination);
    } catch (e) {
      toast('AudioWorklet 不可用，降级到 ScriptProcessor');
      workletNode = null;
    }
  }
  if (!workletNode && audioCtx.createScriptProcessor) {
    scriptNode = audioCtx.createScriptProcessor(4096, 1, 1);
    const ratio = audioCtx.sampleRate / 16000;
    let pos = 0;
    scriptNode.onaudioprocess = e => {
      const ch = e.inputBuffer.getChannelData(0);
      if (ratio === 1) { sendPcm(new Float32Array(ch)); return; }
      const out = [];
      while (pos < ch.length) {
        const i0 = Math.floor(pos), i1 = Math.min(i0 + 1, ch.length - 1);
        const f = pos - i0;
        out.push(ch[i0] * (1 - f) + ch[i1] * f);
        pos += ratio;
      }
      pos -= ch.length;
      sendPcm(new Float32Array(out));
    };
    src.connect(scriptNode);
    scriptNode.connect(audioCtx.destination);
  }
  await audioCtx.resume();
  setMic(true);
}

function stopMic() {
  if (workletNode) { try { workletNode.disconnect(); } catch {} workletNode = null; }
  if (scriptNode) { try { scriptNode.disconnect(); } catch {} scriptNode = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (audioCtx) { audioCtx.close().catch(() => {}); audioCtx = null; }
  $('vubar').style.width = '0%';
  setMic(false);
}

async function listDevices(verbose) {
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const inputs = devices.filter(d => d.kind === 'audioinput');
    const sel = $('deviceSel');
    const prev = sel.value;
    sel.innerHTML = '';
    if (inputs.length === 0) {
      sel.innerHTML = '<option value="default">默认麦克风</option>';
    } else {
      for (const d of inputs) {
        const o = document.createElement('option');
        o.value = d.deviceId;
        o.textContent = d.label || `设备 ${d.deviceId.slice(0, 8)}…`;
        sel.appendChild(o);
      }
    }
    if ([...sel.options].some(o => o.value === prev)) sel.value = prev;
    if (verbose) toast(`发现 ${inputs.length || 1} 个输入设备`);
  } catch (e) {
    toast('枚举设备失败: ' + e.message);
  }
}
navigator.mediaDevices.addEventListener('devicechange', () => listDevices(false));

    $('memBadge').textContent = `显存 活动${(j.mem_active_mb / 1024).toFixed(2)}G 缓存${(j.mem_cache_mb / 1024).toFixed(2)}G`;
    $('memBadge').className = 'badge ' + (j.mem_active_mb > j.mem_limit_mb * 0.8 ? 'err' : '');
  } catch {}
}

// ── 三栏宽度拖动调整 ────────────────────────────────────────────
(function initGrips() {
  const ls = JSON.parse(localStorage.getItem('ominix-cols') || '{}');
  if (ls.l) $('leftCol').style.width = ls.l + 'px';
  if (ls.r) $('rightCol').style.width = ls.r + 'px';

  const save = () => localStorage.setItem('ominix-cols', JSON.stringify({
    l: $('leftCol').offsetWidth, r: $('rightCol').offsetWidth
  }));

  [['gripL', 'leftCol', 1], ['gripR', 'rightCol', -1]].forEach(([gid, colId, dir]) => {
    const grip = $(gid), col = $(colId);
    grip.addEventListener('mousedown', e => {
      e.preventDefault();
      grip.classList.add('active');
      const startX = e.clientX;
      const startW = col.getBoundingClientRect().width;
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
      const move = ev => {
        let w = startW + dir * (ev.clientX - startX);
        w = Math.max(180, Math.min(700, w));
        col.style.width = w + 'px';
      };
      const up = () => {
        grip.classList.remove('active');
        document.removeEventListener('mousemove', move);
        document.removeEventListener('mouseup', up);
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        save();
      };
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
    });
    grip.addEventListener('dblclick', () => {
      col.style.width = '';
      save();
    });
  });
})();
