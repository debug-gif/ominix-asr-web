[package]
name = "ominix-asr-web"
version = "0.1.0"
edition = "2021"
description = "Real-time ASR WebUI with model idle-unload, built on qwen3-asr-mlx"

[dependencies]
qwen3-asr-mlx = { path = "../qwen3-asr-mlx" }
qwen3-mlx = { path = "../qwen3-mlx" }
mlx-lm-utils = { path = "../mlx-rs/mlx-lm-utils" }
mlx-rs = { path = "../mlx-rs", features = ["metal", "accelerate"] }
tokenizers = "0.21"
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
pinyin = "0.10"
